<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Reader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><a class="brand" href="./">▤ <span>Markdown Reader</span></a><button id="open">ファイルを開く</button><input id="file" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden></header>
  <main>
    <section class="intro"><span class="eyebrow">YOUR WORDS, CLEARLY.</span><h1>読むことに、集中。</h1><p>.md ファイルを開くだけ。すっきりとした表示で読めます。</p></section>
    <section id="drop" tabindex="0" role="button" aria-label="Markdown ファイルを選択、またはドロップ"><span class="file-icon">↓</span><strong>Markdown ファイルをドロップ</strong><span>またはクリックして選択 · .md / .markdown</span><small>ファイルはブラウザ内で処理されます</small></section>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="reader" hidden><div class="document-bar"><span id="filename"></span><button id="close">閉じる</button></div><article id="content"></article></section>
  </main>
  <footer>軽く、シンプルに。あなたのための Markdown リーダー。</footer>
  <script type="module" src="app.js"></script>
</body>
</html>
