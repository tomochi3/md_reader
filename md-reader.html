<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Reader</title>
  <style>:root{font-family:system-ui,-apple-system,"Noto Sans",sans-serif;color:#263d39;background:#f7f8f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{height:84px;max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid #dfe5de}.brand{text-decoration:none;color:#284c43;font-size:25px;font-weight:650;display:flex;gap:12px;align-items:center}.brand span{font-size:17px;letter-spacing:-.5px}button{font:inherit;cursor:pointer;border:1px solid #d4ded7;border-radius:8px;background:white;color:#355b4f;padding:10px 17px}button:hover{background:#edf3ec}button:focus-visible,a:focus-visible,#drop:focus-visible{outline:3px solid #719f89;outline-offset:4px}main{max-width:900px;margin:0 auto;padding:68px 28px}.intro{text-align:center}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2.5px;color:#72897a}h1{font-size:clamp(28px,5vw,40px);font-weight:600;letter-spacing:.04em;margin:20px 0 16px}.intro p{font-size:14px;color:#7a867d;line-height:1.8}#drop{margin:46px auto 0;min-height:280px;border:1.5px dashed #b9cabc;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;cursor:pointer;transition:background .15s,border-color .15s}#drop:hover,#drop.dragging{background:#eef5ed;border-color:#588c70}.file-icon{background:#eef3ec;border-radius:14px;width:54px;height:60px;display:grid;place-items:center;font-size:29px;color:#60826e;margin-bottom:7px}#drop strong{font-size:16px;font-weight:550}#drop>span:not(.file-icon){font-size:12px;color:#869086}#drop small{font-size:11px;color:#95a095;margin-top:12px}#status{text-align:center;font-size:13px;color:#886940;min-height:20px}#reader{margin-top:36px;border:1px solid #dfe5de;border-radius:12px;background:white;overflow:hidden}.document-bar{padding:13px 24px;background:#f0f4ee;border-bottom:1px solid #dfe5de;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px}#filename{overflow-wrap:anywhere}.document-bar button{padding:5px 12px;font-size:12px}article{padding:28px 40px 48px;line-height:1.9;overflow-wrap:anywhere;color:#36423b}article h1{text-align:left;font-size:30px;letter-spacing:0}article h2,article h1{border-bottom:1px solid #e5e9e3;padding-bottom:8px}article pre{background:#f3f5f1;padding:18px;border-radius:7px;overflow:auto}article code{font-family:ui-monospace,monospace;font-size:.9em;background:#f3f5f1;padding:2px 5px;border-radius:3px}article pre code{padding:0}article blockquote{border-left:3px solid #96b49e;margin-left:0;padding-left:20px;color:#738174}article a{color:#347559}article table{display:block;overflow:auto;border-collapse:collapse}article th,article td{border:1px solid #dce3d9;padding:8px 14px}article hr{border:0;border-top:1px solid #dfe5de;margin:28px 0}footer{text-align:center;font-size:11px;color:#98a195;padding:18px 24px 35px}[hidden]{display:none!important}@media(max-width:550px){header{padding:0 20px;height:72px}.brand span{font-size:14px}header button{font-size:12px;padding:9px 12px}main{padding:48px 18px}article{padding:20px}.document-bar{padding:12px 16px}#drop strong{font-size:14px}}
</style>
</head>
<body>
  <header><a class="brand" href="./">▤ <span>Markdown Reader</span></a><button id="open">ファイルを開く</button><input id="file" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden></header>
  <main>
    <section class="intro"><span class="eyebrow">YOUR WORDS, CLEARLY.</span><h1>読むことに、集中。</h1><p>.md ファイルを開くだけ。すっきりとした表示で読めます。</p></section>
    <section id="drop" tabindex="0" role="button" aria-label="Markdown ファイルを選択、またはドロップ"><span class="file-icon">↓</span><strong>Markdown ファイルをドロップ</strong><span>またはクリックして選択 · .md / .markdown</span><small>ファイルはブラウザ内で処理されます</small></section>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="reader" hidden><div class="document-bar"><span id="filename"></span><button id="close">閉じる</button></div><article id="content"></article></section>
  </main>
  <footer>軽く、シンプルに。あなたのための Markdown リーダー。</footer>
